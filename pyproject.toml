[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ent-agent"
version = "0.1.0"
description = "Enterprise-grade LangChain + LangGraph agent with layered guardrails, HITL approvals, audit trail and an API"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyjwt>=2.8",
    "httpx>=0.27",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0"]
anthropic = ["langchain-anthropic>=1.0"]
postgres = ["langgraph-checkpoint-postgres>=2.0", "psycopg[binary,pool]>=3.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.package-data]
ent_agent = ["static/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501", "B008"]  # asserts ok in tests; long lines ok; FastAPI Depends() idiom

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
