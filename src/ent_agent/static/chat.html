<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support copilot</title>
<link rel="stylesheet" href="/ui/chat.css">
</head>
<body>
<main>
  <header>
    <h1>Support copilot</h1>
    <form id="tokenform" autocomplete="off">
      <label for="token">Access token</label>
      <input id="token" type="password" placeholder="paste a bearer token (kept in memory only)" required>
      <button type="submit">Use token</button>
      <button type="button" id="clear">Clear</button>
    </form>
    <p id="who" class="muted">Not signed in.</p>
  </header>
  <section id="log" aria-live="polite" aria-label="Conversation"></section>
  <form id="chatform" autocomplete="off">
    <input id="msg" type="text" maxlength="8000" placeholder="Ask about a policy, an order, or request a refund" required>
    <button type="submit" id="send">Send</button>
  </form>
  <section id="approvals" aria-label="Pending approvals">
    <h2>Pending approvals <button type="button" id="refresh">Refresh</button></h2>
    <p class="muted">Visible to users with the approver role. You cannot approve your own request.</p>
    <div id="approvallist"></div>
  </section>
</main>
<script src="/ui/chat.js"></script>
</body>
</html>
